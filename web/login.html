<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - OpenCode Go Session Proxy</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--line:#272b35;--fg:#e6e8ee;--acc:#5b8cff;--err:#ff6b6b}
@media(prefers-color-scheme:light){:root{--bg:#f5f6f8;--panel:#fff;--line:#dfe2e8;--fg:#1b1e25;--acc:#2f63e0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
form{max-width:320px;margin:15vh auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
h2{margin:0 0 12px;font-size:16px}
input,button{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
input{margin-bottom:10px}button{cursor:pointer;background:var(--acc);border-color:var(--acc);color:#fff}
.err{color:var(--err);margin-top:10px}
</style>
</head>
<body>
<form method="post" action="/admin/login">
  <h2>OpenCode Go Session Proxy</h2>
  <input name="password" type="password" placeholder="Admin password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
  <!--ERR-->
</form>
</body>
</html>
